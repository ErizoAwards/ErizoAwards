    <title>Ranking Histórico - ERIZO AWARDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
:root {
    --gold: #bf953f;
    --gold-gradient: linear-gradient(to bottom, #cf9d3e, #ffefbb, #bf953f, #fcf6ba, #b38728);
    --dark: #0a0a0a;
    --card-bg: #161616;
}

body {
    margin: 0; padding: 0;
    background-color: var(--dark);
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    scroll-behavior: smooth;
}

header {
    height: 60vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
    border-bottom: 2px solid var(--gold);
}

.gold-text {
    font-family: 'Cinzel', serif;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 700;
}

.subtitle { color: var(--gold); letter-spacing: 3px; margin-top: 15px; text-transform: uppercase; }

.nav-bar {
    position: sticky; top: 0;
    background: rgba(10, 10, 10, 0.98);
    padding: 15px;
    display: flex; justify-content: center; align-items: center; gap: 30px;
    z-index: 1000; border-bottom: 1px solid #333;
}

.nav-link {
    color: white; text-decoration: none; font-weight: bold;
    border: 1px solid white; padding: 10px 20px; border-radius: 5px;
}

.dropbtn {
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold); padding: 10px 20px;
    font-weight: bold; cursor: pointer; border-radius: 5px;
}

.dropdown-content {
    display: none; position: absolute; background-color: #111;
    min-width: 180px; border: 1px solid var(--gold); z-index: 1;
}

.dropdown-content a {
    color: white; padding: 12px 16px; text-decoration: none; display: block;
}

.dropdown-content a:hover { background: var(--gold); color: black; }
.dropdown:hover .dropdown-content { display: block; }

/* CONTENEDOR DEL FORMULARIO (MÁS ANCHO) */
.vote-container { 
    background: #fff; 
    border-radius: 20px; 
    overflow: hidden; 
    border: 3px solid var(--gold); 
    margin: 20px auto;
    width: 100%; /* Ocupa todo el ancho disponible */
}

iframe { width: 100%; border: none; }

.section-title { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; font-size: 2rem; margin-top: 50px;}

.history-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
    gap: 30px; 
    padding: 40px 0; 
}

/* EFECTO DE ZOOM EN LAS TARJETAS */
.year-card { 
    background: var(--card-bg); 
    border: 1px solid #222; 
    border-radius: 15px; 
    padding: 25px; 
    text-align: center;
    transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    cursor: default;
}

.year-card:hover { 
    transform: scale(1.1); /* SE AGRANDA UN 10% */
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(191, 149, 63, 0.4);
    z-index: 10; /* Asegura que la tarjeta que crece esté por encima de las otras */
}

.winner-img { 
    width: 150px; 
    height: 150px; 
    border-radius: 10px; /* Cuadrado con bordes redondeados */
    border: 2px solid var(--gold); 
    object-fit: cover; 
    margin-bottom: 15px; 
}

.winner-name {
    font-size: 1.5rem;
    font-weight: bold;
    text-transform: uppercase;
}

.music-player { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
#musicBtn { background: var(--gold); border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; }

</style>
    
    <style>
        /* ESTILOS ESPECÍFICOS PARA LA PÁGINA DE RANKING */
        .ranking-page { max-width: 1000px; margin: 0 auto; padding: 50px 20px; }

        /* CONTENEDOR DE FILTROS */
        .filters-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .filter-select {
            background: #222;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            min-width: 200px;
            text-align: center;
        }

        .filter-select:hover { background: #333; }

        /* TABLA */
        .ranking-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .ranking-table th {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            text-align: left;
            padding: 15px 20px;
            border-bottom: 2px solid var(--gold);
            text-transform: uppercase;
        }

        .ranking-table td {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            border: 1px solid #444;
            vertical-align: middle;
        }

        /* Bordes redondeados para las filas */
        .ranking-table td:first-child { border-radius: 10px 0 0 10px; border-left: 2px solid #444;}
        .ranking-table td:last-child { border-radius: 0 10px 10px 0; border-right: 2px solid #444;}

        /* Columnas */
        .rank-pos { font-weight: 700; font-size: 1.5rem; color: var(--gold); text-align: center; width: 60px; }
        .rank-name { font-size: 1.2rem; font-weight: 600; color: #fff; }
        .rank-count { font-size: 1.5rem; font-weight: bold; text-align: center; width: 80px; }
        .rank-detail { font-size: 0.85rem; color: #aaa; line-height: 1.4; }

        /* COLORES DE PODIO */
        /* Oro */
        .gold-row td { border-color: #ffd700; background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent); }
        .gold-row .rank-pos { color: #ffd700; font-size: 2rem; }
        
        /* Plata */
        .silver-row td { border-color: #c0c0c0; background: linear-gradient(90deg, rgba(192, 192, 192, 0.1), transparent); }
        .silver-row .rank-pos { color: #c0c0c0; }

        /* Bronce */
        .bronze-row td { border-color: #cd7f32; background: linear-gradient(90deg, rgba(205, 127, 50, 0.1), transparent); }
        .bronze-row .rank-pos { color: #cd7f32; }

        /* Botón volver */
        .back-btn { display: inline-block; margin-bottom: 30px; color: var(--gold); text-decoration: none; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: var(--gold); color: black; }
    </style>
</head>

// --- FUNCIÓN DE CÁLCULO ---
function updateRanking() {
    const yearVal = document.getElementById("yearFilter").value;
    const tbody = document.getElementById("rankingBody");
    
    tbody.innerHTML = ""; 

    // 1. Filtrar solo por año
    const filteredData = awardsDB.filter(item => {
        return (yearVal === "all") || (item.year == yearVal);
    });

    // 2. Agrupar
    const counts = {};
    filteredData.forEach(item => {
        const name = item.name.toUpperCase();
        if (!counts[name]) counts[name] = { total: 0, details: [] };
        counts[name].total++;
        counts[name].details.push(`${item.cat} (${item.year})`);
    });

    // 3. Ordenar
    const sortedRanking = Object.keys(counts).map(key => {
        return { name: key, ...counts[key] };
    }).sort((a, b) => b.total - a.total);

    // 4. Mostrar
    if (sortedRanking.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>No hay resultados.</td></tr>";
        return;
    }

    let currentRank = 1;
    sortedRanking.forEach((item, index) => {
        
        // --- LÓGICA DE RANKING CORREGIDA (Salto de posiciones) ---
        // Si no es el primero y tiene menos puntos que el anterior, el ranking es su posición real (index + 1)
        if (index > 0 && item.total < sortedRanking[index - 1].total) {
            currentRank = index + 1;
        }
        // Si tiene los mismos puntos, currentRank se mantiene igual (empate)

        let rowClass = "";
        if (currentRank === 1) rowClass = "gold-row";
        else if (currentRank === 2) rowClass = "silver-row";
        else if (currentRank === 3) rowClass = "bronze-row";

        const row = `
            <tr class="${rowClass}">
                <td class="rank-pos">${currentRank}º</td>
                <td class="rank-name">${item.name}</td>
                <td class="rank-count">${item.total}</td>
                <td class="rank-detail">${item.details.join(", ")}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

window.onload = updateRanking;
